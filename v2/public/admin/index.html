<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back office — Tenana Rentals</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="../../src/css/tokens.css">
<link rel="stylesheet" href="../../src/css/base.css">
<link rel="stylesheet" href="../../src/css/components.css">
<link rel="stylesheet" href="../../src/css/admin.css">
<script type="module" src="../../src/js/admin/main.js"></script>
</head>
<body>

<!-- Sign in. Shown until Supabase says who this is, and the database says
     they are an administrator. -->
<div class="signin" id="signin" hidden>
  <div class="signin__card">
    <h1>Back office</h1>
    <p class="sub">Tenana Rentals</p>
    <form id="signin-form" novalidate>
      <div class="field">
        <label for="s-email">Email</label>
        <input id="s-email" name="email" type="email" inputmode="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="s-password">Password</label>
        <input id="s-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="msg msg--bad" id="signin-error" role="alert"></div>
      <button class="btn btn--solid btn--block" id="signin-submit" type="submit">Sign in</button>
    </form>
  </div>
</div>

<!-- The office itself -->
<div id="shell" hidden>
  <header class="bar">
    <div class="bar__in">
      <strong>Tenana Rentals</strong>
      <div class="row__actions">
        <span class="bar__who" id="who"></span>
        <button type="button" id="signout">Sign out</button>
      </div>
    </div>
  </header>

  <nav class="nav" aria-label="Sections">
    <div class="nav__in" id="nav"></div>
  </nav>

  <main class="admin" id="view" tabindex="-1"></main>
</div>

<noscript>
  <div class="signin"><div class="signin__card">
    <h1>Back office</h1>
    <p class="sub">This page needs JavaScript switched on.</p>
  </div></div>
</noscript>

</body>
</html>
